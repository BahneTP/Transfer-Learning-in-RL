# @package _global_
defaults:
  - /experiment/atari100k/sac_bbf/roadrunner
  - _self_

algorithm:
  encoder_type: resnet18
  resnet18_weights: DEFAULT
  resnet18_variant: resnet_layer3_reduced
  protect_encoder_from_reset: true
  transfer_mode: lora
  lora_rank: 1
  lora_alpha: 2.0
  freeze_encoder_bn: true
  learning_rate: 1e-5
  encoder_lr_scale: 1.0
